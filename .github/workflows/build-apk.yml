name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prototipe/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototipe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build web (Vite)
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: prototipe/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          echo "=== APK files ==="
          find . -name "*.apk"
          ls -la app/build/outputs/apk/debug/

      - name: Rename APK
        working-directory: prototipe/android
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/reshia_prototipe.apk
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: re-shinrive-arena-debug
          path: prototipe/android/app/build/outputs/apk/debug/reshia_prototipe.apk
          if-no-files-found: error
          retention-days: 14
